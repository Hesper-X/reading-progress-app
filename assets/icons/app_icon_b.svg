<svg width="140" height="140" viewBox="0 0 140 140" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 纯橙色方形底（同启动页渐变主色 #FF6B6B，四周倒圆角 28px） -->
  <rect x="0" y="0" width="140" height="140" rx="28" ry="28" fill="#FF6B6B"/>

  <!-- 绿色进度环（全绿，不产生数据歧义，5px 细线更精致） -->
  <circle cx="70" cy="70" r="48" stroke="#51CF66" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- 左侧：书架（白色，在橙色底上对比更强） -->
  <rect x="48" y="50" width="18" height="34" rx="3" fill="#FFFFFF" opacity="0.95"/>
  <line x1="51" y1="60" x2="63" y2="60" stroke="#FF6B6B" stroke-width="2.5" opacity="0.9" stroke-linecap="round"/>
  <line x1="51" y1="72" x2="63" y2="72" stroke="#FF6B6B" stroke-width="2.5" opacity="0.9" stroke-linecap="round"/>

  <!-- 右侧第一本书（倾斜 -10°，白色） -->
  <g transform="rotate(-10 74 67)">
    <rect x="70" y="52" width="9" height="30" rx="2" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- 右侧第二本书（倾斜 -8°，白色） -->
  <g transform="rotate(-8 86 67)">
    <rect x="82" y="52" width="9" height="30" rx="2" fill="#FFFFFF" opacity="0.85"/>
  </g>
</svg>
