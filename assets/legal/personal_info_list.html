<p>本应用致力于最小化个人信息收集。以下是应用收集的信息类型及用途说明：</p>

<table>
<tr><th>个人信息类型</th><th>收集方式</th><th>使用目的</th><th>是否必需</th></tr>
<tr><td>设备型号、操作系统版本</td><td>自动获取</td><td>提供适配服务、问题排查</td><td>是</td></tr>
<tr><td>应用内购买记录</td><td>IAP 回调</td><td>解锁 Pro 功能</td><td>是</td></tr>
<tr><td>您输入的书籍信息</td><td>用户主动输入</td><td>提供阅读追踪功能</td><td>是</td></tr>
<tr><td>阅读打卡记录</td><td>用户主动创建</td><td>提供打卡统计功能</td><td>否</td></tr>
</table>

<h2>说明</h2>
<p>所有您创建的书籍和阅读数据仅存储在您的设备本地，我们不会收集中转到任何服务器。</p>
